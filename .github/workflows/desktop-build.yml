name: desktop-build

# 桌面端（macOS arm64）可复现构建 + 干净环境冒烟。
# 产物为未签名（ad-hoc）.app/dmg/zip——仅作构建验证，不发布 Release；
# 正式分发由维护者人工复核后手动处理。

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "desktop_main.py"
      - "desktop.spec"
      - "scripts/build_desktop.py"
      - "scripts/server.py"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "desktop_main.py"
      - "desktop.spec"
      - "scripts/build_desktop.py"
      - "scripts/server.py"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  tests:
    name: desktop unit/integration · macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Desktop unit tests
        run: python -m pytest tests/unit/test_desktop.py -q

      - name: Desktop integration (server API + DSH child-env pipelines)
        run: python -m pytest tests/integration/test_desktop_smoke.py -q

      - name: App smoke (no window; bundled bridge semantics)
        run: python -m desktop.app --smoke --home "$RUNNER_TEMP/dshrl-smoke"

  build-macos:
    name: build .app + dmg/zip · macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      # 构建：Node 从 nodejs.org 官方 tarball 取（固定版本 + 记录 sha256），
      # DSH 用 npm 官方源安装到独立 prefix；产物 ad-hoc 签名（未公证）。
      - name: Build desktop app
        run: python scripts/build_desktop.py --verify

      - name: Show verify report
        run: cat build/desktop/verify-report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/checksums.sha256
            build/desktop/verify-report.json
          if-no-files-found: error
          retention-days: 14
