name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 发布前先证明"包内容可跑"：在本平台完整验收一遍
      - name: Acceptance suite
        run: python scripts/verify.py

      - name: Build platform package
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.call([sys.executable, "scripts/build_package.py"]))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: |
            dist/dsh-research-lab-*
          if-no-files-found: error
          retention-days: 30

  # 桌面端（macOS arm64）：内置真实 DSH + Node 22 + 科研栈，开箱可用。
  # 构建含干净环境冒烟（装配 → 双管线 → 真实启动 DSH → token 断言），
  # 失败即中止发布；产物未签名未公证，分发说明见 docs/desktop.md。
  desktop:
    name: desktop · macos arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build desktop app + smoke (with bundled DSH)
        run: python scripts/build_desktop.py --verify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin-arm64
          path: |
            dist/desktop/dsh-research-lab-*.dmg
            dist/desktop/dsh-research-lab-*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [package, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          sha256sum dsh-research-lab-* > checksums.sha256
          cat checksums.sha256

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dsh-research-lab-*
            artifacts/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
