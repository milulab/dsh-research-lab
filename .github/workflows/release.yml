name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 发布前先证明"包内容可跑"：在本平台完整验收一遍
      - name: Acceptance suite
        run: python scripts/verify.py

      - name: Build platform package
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.call([sys.executable, "scripts/build_package.py"]))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: |
            dist/dsh-research-lab-*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          sha256sum dsh-research-lab-* > checksums.sha256
          cat checksums.sha256

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dsh-research-lab-*
            artifacts/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
