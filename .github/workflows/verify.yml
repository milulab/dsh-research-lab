name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Data integrity (SHA256 vs source.yml)
        run: python scripts/fetch_data.py

      - name: Education pipeline (T1–T5)
        run: python examples/education-demo/run_t1_t5.py

      - name: Health pipeline (H1–H5)
        run: python examples/health-demo/run_h1_h5.py

      - name: Acceptance suite (31 checks)
        run: python scripts/verify.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            examples/education-demo/outputs/
            examples/health-demo/outputs/
          if-no-files-found: warn
          retention-days: 14
