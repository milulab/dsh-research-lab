notes:
  - This is secondary-school (high school) student data, two schools in Portugal.
    Do not describe it as university student data; the teaching audience is
    university faculty, the research topic is education research methodology.
  - The upstream note states 382 students appear in both course files. Within-file
    duplicate handling is audited in protocol T1; cross-file merging as independent
    samples is prohibited by the primary analysis plan.
  - In raw/student-por.csv the grade columns G1/G2 carry quote characters
    ("0", "11"). Standard CSV parsers silently strip the quotes and infer
    integers, so the anomaly disappears at parse time. The data-intake skill
    therefore requires inspecting raw bytes / declaring expected dtypes before
    analysis - an intentional teaching point on silent type coercion.
