notes:
  - Primary analysis uses only the processed Cleveland file (303 records), the
    convention of the historical literature.
  - The original target `num` is 0-4 (presence of vessels with >50% diameter
    narrowing). Any binary conversion MUST record the mapping rule explicitly;
    the standard teaching rule used here is 0 -> 0, 1-4 -> 1.
  - Historical research data. Predictions from this dataset MUST NOT be used
    for real clinical diagnosis or individual health decisions.
